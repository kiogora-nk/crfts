<!DOCTYPE html><html lang='en'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Change Password - CRFTS</title>
<link href='https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css' rel='stylesheet'>
<style>:root{--primary:#1a237e;--sidebar:240px}*{margin:0;padding:0}body{font-family:'Segoe UI',Arial,sans-serif;background:#f0f2f5;display:flex}.sidebar{width:var(--sidebar);background:linear-gradient(180deg,#0d1b4a,#1a237e,#283593);color:#fff;position:fixed;left:0;top:0;bottom:0}.main{margin-left:var(--sidebar);flex:1;padding:25px}.card{background:#fff;border-radius:10px;padding:25px;box-shadow:0 1px 3px rgba(0,0,0,.05);max-width:500px;margin:0 auto}</style></head>
<body><aside class='sidebar'><div class='logo'><img src='/static/images/logo.png' alt='County Logo' style='width:60px;height:60px;border-radius:50%;margin-bottom:8px;background:white;padding:5px' onerror="this.style.display='none'"><h5>CRFTS</h5></div></aside>
<main class='main'><div class='card'><h4 class='mb-3'><i class='fas fa-key me-2'></i>Change Password</h4>
<form method='POST'>{% csrf_token %}
<div class='mb-3'><label class='form-label'>Current Password</label><input type='password' name='old_password' class='form-control' required></div>
<div class='mb-3'><label class='form-label'>New Password</label><input type='password' name='new_password' class='form-control' required></div>
<div class='mb-3'><label class='form-label'>Confirm New Password</label><input type='password' name='confirm_password' class='form-control' required></div>
<button type='submit' class='btn btn-primary'><i class='fas fa-save me-1'></i>Change Password</button></form></div></main></body></html>
