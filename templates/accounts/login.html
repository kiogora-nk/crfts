<!DOCTYPE html><html lang='en'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Login - Meru County</title>
<link href='https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css' rel='stylesheet'>
<link href='https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css' rel='stylesheet'>
<style>*{margin:0;padding:0;box-sizing:border-box}body{background:linear-gradient(135deg,#0d1b4a 0%,#1a237e 50%,#2a0a5e 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:'Segoe UI',Arial;padding:20px}.login-box{width:440px;max-width:100%;background:#fff;border-radius:20px;box-shadow:0 30px 80px rgba(0,0,0,.5);overflow:hidden}.login-header{background:linear-gradient(135deg,#1a237e,#283593);color:#fff;padding:35px 30px;text-align:center}.login-header img{width:80px;height:80px;border-radius:50%;background:white;padding:5px;margin-bottom:10px}.login-header h3{font-size:22px;font-weight:700;margin:0;letter-spacing:1px}.login-header p{font-size:11px;opacity:.8;margin:5px 0 0;letter-spacing:2px;text-transform:uppercase}.login-body{padding:30px}.form-group{margin-bottom:18px}.form-group label{font-weight:600;font-size:13px;color:#333;margin-bottom:5px;display:block;text-transform:uppercase;letter-spacing:.5px}.input-group-text{background:#fff;border:2px solid #e0e0e0;border-right:none;border-radius:10px 0 0 10px;padding:12px 15px;color:#666}.form-control{border:2px solid #e0e0e0;border-left:none;border-radius:0 10px 10px 0;padding:12px 15px;font-size:14px}.form-control:focus{border-color:#1a237e;box-shadow:none}.password-group{position:relative}.password-group .form-control{border-radius:0;border-left:none}.password-group .toggle-password{position:absolute;right:10px;top:50%;transform:translateY(-50%);cursor:pointer;color:#666;font-size:18px;z-index:10;background:white;padding:5px}.captcha-box{background:linear-gradient(135deg,#f5f7fa,#c3cfe2);border:2px solid #1a237e;border-radius:12px;padding:20px;text-align:center;margin-bottom:18px}.captcha-box .question{font-size:28px;font-weight:800;color:#1a237e;letter-spacing:3px;margin-bottom:10px}.captcha-box .hint{font-size:12px;color:#666}.captcha-input-full{border:2px solid #e0e0e0!important;border-radius:10px!important;padding:12px!important;text-align:center;font-size:18px!important;font-weight:700!important;letter-spacing:2px!important}.btn-login{background:linear-gradient(135deg,#1a237e,#283593);color:#fff;padding:14px;font-weight:700;font-size:15px;border:none;width:100%;border-radius:10px;cursor:pointer;transition:.3s;text-transform:uppercase;letter-spacing:1px}.btn-login:hover{transform:translateY(-2px);box-shadow:0 10px 30px rgba(26,35,126,.4)}.alert{border-radius:10px;font-size:13px;padding:12px 15px;margin-bottom:15px}.footer-text{text-align:center;margin-top:20px;font-size:11px;color:#999}.forgot-link{text-align:center;margin-top:15px}.forgot-link a{color:#1a237e;text-decoration:none;font-size:13px;font-weight:600}.forgot-link a:hover{color:#ff6f00}</style></head>
<body><div class='login-box'><div class='login-header'><img src='/static/images/logo.png' alt='Meru County Logo' onerror="this.style.display='none'"><h3>Meru County</h3><p>Registry & File Tracking System</p></div>
<div class='login-body'><form method='POST'>{% csrf_token %}
<div class='form-group'><label><i class='fas fa-id-card me-2'></i>Payroll Number</label><div class='input-group'><span class='input-group-text'><i class='fas fa-user'></i></span><input type='text' name='payroll' class='form-control' placeholder='Enter your payroll number' required autofocus></div></div>
<div class='form-group'><label><i class='fas fa-lock me-2'></i>Password</label><div class='input-group password-group'><span class='input-group-text'><i class='fas fa-key'></i></span><input type='password' name='password' class='form-control' id='passwordField' placeholder='Enter your password' required><i class='fas fa-eye toggle-password' id='togglePassword' onclick='togglePass()'></i></div></div>
<div class='captcha-box'><i class='fas fa-shield-alt' style='font-size:20px;color:#1a237e;margin-bottom:8px;display:block'></i><div class='question'>{{ captcha_question }}</div><div class='hint'>Solve this simple math to verify you're human</div></div>
<input type='hidden' name='captcha_correct' value='{{ captcha_answer }}'>
<input type='text' name='captcha_answer' class='form-control captcha-input-full' placeholder='Type your answer here' required>
{% if error %}<div class='alert alert-danger mt-3'><i class='fas fa-exclamation-circle me-1'></i>{{ error }}</div>{% endif %}
<button type='submit' class='btn-login mt-3'><i class='fas fa-sign-in-alt me-2'></i>Secure Login</button></form>
<div class='forgot-link'><a href='/password-reset/'><i class='fas fa-key me-1'></i>Forgot Password? Contact ICT Department</a></div>
<div class='footer-text'><i class='fas fa-shield-alt me-1'></i>Secured System &bull; Meru County Government &copy; 2026</div></div></div>
<script>
function togglePass(){
    var f=document.getElementById('passwordField');
    var i=document.getElementById('togglePassword');
    if(f.type==='password'){f.type='text';i.className='fas fa-eye-slash toggle-password'}
    else{f.type='password';i.className='fas fa-eye toggle-password'}
}
</script></body></html>
