<!DOCTYPE html><html lang='en'><head><meta charset='UTF-8'><title>Password Reset - Meru County</title>
<link href='https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css' rel='stylesheet'>
<style>body{background:linear-gradient(135deg,#0d1b4a,#2a0a5e);min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:Arial}.card{background:#fff;border-radius:15px;padding:30px;max-width:450px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.4)}h3{color:#1a237e}input{padding:12px;width:100%;border:2px solid #ddd;border-radius:8px;margin:10px 0}button{background:#1a237e;color:#fff;padding:12px 30px;border:none;border-radius:8px;cursor:pointer;font-weight:600}</style></head>
<body><div class='card'><h3>Password Reset</h3><p>Enter your payroll number. Contact ICT Department if you need assistance.</p>
<form method='POST'>{% csrf_token %}<input name='payroll' placeholder='Payroll Number' required><button type='submit'>Reset Password</button></form>
{% if msg %}<div class='alert alert-info mt-3'>{{ msg }}</div>{% endif %}
<p class='mt-3'><a href='/login/'>Back to Login</a></p>
<p class='text-muted mt-2'>ICT Helpdesk: ict@meru.go.ke | Ext: 1234</p></div></body></html>
