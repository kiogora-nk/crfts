<!DOCTYPE html><html lang='en'><head><meta charset='UTF-8'><title>Admin Employees</title><link href='https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css' rel='stylesheet'>
<style>:root{--p:#b71c1c;--s:240px}*{margin:0;padding:0}body{font-family:'Segoe UI',Arial;background:#f0f2f5;display:flex}.sidebar{width:var(--s);background:#b71c1c;color:#fff;position:fixed;left:0;top:0;bottom:0;padding:20px}.sidebar a{color:rgba(255,255,255,.8);display:block;padding:10px;text-decoration:none}.main{margin-left:var(--s);flex:1;padding:20px}.card{background:#fff;padding:18px;border-radius:10px}table{width:100%}th{background:#f8f9fa;padding:8px}td{padding:8px}</style></head>
<body><div class='sidebar'><h5>MERU ADMIN</h5><a href='/admin-panel/'>Dashboard</a><a href='/admin-panel/employees/' style='color:#fff'>Employees</a><a href='/logout/'>Logout</a></div>
<div class='main'><h4>Employees</h4><div class='card mb-2'><form method='POST'>{% csrf_token %}<input name='payroll' placeholder='Payroll' class='form-control mb-1' required><input name='name' placeholder='Name' class='form-control mb-1' required><select name='dept' class='form-select mb-1' required><option value=''>Dept</option>{% for d in departments %}<option value='{{ d.id }}'>{{ d.name }}</option>{% endfor %}</select><input name='email' placeholder='Email' class='form-control mb-1' required><button class='btn btn-primary btn-sm'>Add</button></form></div>
<div class='card'><table><tr><th>Payroll</th><th>Name</th><th>Dept</th><th>Email</th></tr>{% for e in employees %}<tr><td>{{ e.payroll }}</td><td>{{ e.name }}</td><td>{{ e.department.name }}</td><td>{{ e.email }}</td></tr>{% endfor %}</table></div></div></body></html>
