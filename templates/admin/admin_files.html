<!DOCTYPE html><html lang='en'><head><meta charset='UTF-8'><title>Admin Files</title><link href='https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css' rel='stylesheet'><link href='https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css' rel='stylesheet'>
<style>:root{--p:#b71c1c;--s:240px}*{margin:0;padding:0}body{font-family:'Segoe UI',Arial;background:#f0f2f5;display:flex}.sidebar{width:var(--s);background:#b71c1c;color:#fff;position:fixed;left:0;top:0;bottom:0;padding:20px}.sidebar a{color:rgba(255,255,255,.8);display:block;padding:10px;text-decoration:none}.main{margin-left:var(--s);flex:1;padding:20px}.card{background:#fff;padding:18px;border-radius:10px}table{width:100%}th{background:#f8f9fa;padding:8px}td{padding:8px;border-bottom:1px solid #eee}</style></head>
<body><div class='sidebar'><h5>ADMIN</h5><a href='/admin-panel/'>Dashboard</a><a href='/admin-panel/files/' style='color:#fff'>Files</a><a href='/logout/'>Logout</a></div>
<div class='main'><h4>All Files</h4><form class='my-2'><input name='q' value='{{ q }}' class='form-control' placeholder='Search...'></form>
<div class='card'><table><tr><th>File Number</th><th>Subject</th><th>Dept</th><th>Holder</th><th>Status</th></tr>
{% for f in files %}<tr><td>{{ f.file_number }}</td><td>{{ f.subject|truncatechars:50 }}</td><td>{{ f.current_department.name }}</td><td>{{ f.current_holder.name|default:'--' }}</td><td>{{ f.status }}</td></tr>{% endfor %}</table></div></div></body></html>
