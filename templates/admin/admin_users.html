<!DOCTYPE html><html lang='en'><head><meta charset='UTF-8'><title>Admin Users</title><link href='https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css' rel='stylesheet'>
<style>:root{--p:#b71c1c;--s:240px}*{margin:0;padding:0}body{font-family:'Segoe UI',Arial;background:#f0f2f5;display:flex}.sidebar{width:var(--s);background:#b71c1c;color:#fff;position:fixed;left:0;top:0;bottom:0;padding:20px}.sidebar a{color:rgba(255,255,255,.8);display:block;padding:10px;text-decoration:none}.main{margin-left:var(--s);flex:1;padding:20px}.card{background:#fff;padding:18px;border-radius:10px}table{width:100%}th{background:#f8f9fa;padding:8px}td{padding:8px}</style></head>
<body><div class='sidebar'><h5>MERU ADMIN</h5><a href='/admin-panel/'>Dashboard</a><a href='/admin-panel/users/' style='color:#fff'>Users</a><a href='/logout/'>Logout</a></div>
<div class='main'><h4>User Accounts</h4><div class='card mb-2'><form method='POST'>{% csrf_token %}<select name='employee' class='form-select mb-1' required><option value=''>Select Employee</option>{% for e in employees %}<option value='{{ e.id }}'>{{ e.payroll }} - {{ e.name }}</option>{% endfor %}</select><select name='role' class='form-select mb-1' required><option value=''>Select Role</option>{% for r in roles %}<option value='{{ r.id }}'>{{ r.name }}</option>{% endfor %}</select><input name='password' type='password' placeholder='Password' class='form-control mb-1' required><button class='btn btn-primary btn-sm'>Create User</button></form></div>
<div class='card'><table><tr><th>Payroll</th><th>Employee</th><th>Role</th><th>Active</th></tr>{% for u in users %}<tr><td>{{ u.payroll_number }}</td><td>{{ u.employee.name|default:'--' }}</td><td>{{ u.role.name|default:'--' }}</td><td>{{ u.is_active }}</td></tr>{% endfor %}</table></div></div></body></html>
