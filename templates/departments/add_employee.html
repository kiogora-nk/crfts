<!DOCTYPE html><html lang='en'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Add Employee - CRFTS</title>
<link href='https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css' rel='stylesheet'>
<style>:root{--primary:#1a237e;--sidebar:240px}*{margin:0;padding:0}body{font-family:'Segoe UI',Arial,sans-serif;background:#f0f2f5;display:flex}.sidebar{width:var(--sidebar);background:linear-gradient(180deg,#0d1b4a,#1a237e,#283593);color:#fff;position:fixed;left:0;top:0;bottom:0}.sidebar .logo{padding:20px;text-align:center}.sidebar .logo i{font-size:40px}.sidebar nav a{display:flex;align-items:center;color:rgba(255,255,255,.75);padding:11px 25px;text-decoration:none;font-size:13px}.main{margin-left:var(--sidebar);flex:1;padding:25px}.card{background:#fff;border-radius:10px;padding:25px;box-shadow:0 1px 3px rgba(0,0,0,.05);max-width:600px}.form-label{font-weight:600;font-size:13px;display:block;margin-bottom:3px}.form-control,.form-select{padding:10px;border:2px solid #ddd;border-radius:8px;width:100%;margin-bottom:15px}@media(max-width:768px){.sidebar{width:55px}.sidebar .logo h5,.sidebar nav a span{display:none}.main{margin-left:55px}}</style></head>
<body><aside class='sidebar'><div class='logo'><i class='fas fa-building-columns'></i><h5>CRFTS</h5></div><nav><a href='/'><i class='fas fa-th-large'></i> <span>Dashboard</span></a></nav></aside>
<main class='main'><h4 class='mb-4'><i class='fas fa-user-plus text-primary me-2'></i>Add Employee</h4>
<div class='card'><form method='POST'>{% csrf_token %}
<label class='form-label'>Payroll Number *</label><input name='payroll' class='form-control' required>
<label class='form-label'>Full Name *</label><input name='name' class='form-control' required>
<label class='form-label'>Department *</label><select name='dept' class='form-select' required><option value=''>Select Department</option>{% for d in departments %}<option value='{{ d.id }}'>{{ d.name }}</option>{% endfor %}</select>
<label class='form-label'>Designation</label><input name='designation' class='form-control'>
<label class='form-label'>Email *</label><input name='email' type='email' class='form-control' required>
<label class='form-label'>Phone</label><input name='phone' class='form-control'>
<button type='submit' class='btn btn-primary btn-lg'><i class='fas fa-save me-1'></i>Save Employee</button>
<a href='/employees/' class='btn btn-secondary btn-lg ms-2'>Cancel</a></form></div></main></body></html>
