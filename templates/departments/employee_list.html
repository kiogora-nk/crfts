<!DOCTYPE html><html lang='en'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Employees - CRFTS</title>
<link href='https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css' rel='stylesheet'>
<link href='https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css' rel='stylesheet'>
<style>:root{--primary:#1a237e;--sidebar:240px}*{margin:0;padding:0}body{font-family:'Segoe UI',Arial,sans-serif;background:#f0f2f5;display:flex}.sidebar{width:var(--sidebar);background:linear-gradient(180deg,#0d1b4a,#1a237e,#283593);color:#fff;position:fixed;left:0;top:0;bottom:0}.sidebar .logo{padding:20px;text-align:center}.sidebar .logo i{font-size:40px}.sidebar nav a{display:flex;align-items:center;color:rgba(255,255,255,.75);padding:11px 25px;text-decoration:none;font-size:13px}.sidebar nav a:hover,.sidebar nav a.active{color:#fff;background:rgba(255,255,255,.1)}.sidebar nav a i{width:22px}.main{margin-left:var(--sidebar);flex:1;padding:25px}.card{background:#fff;border-radius:10px;padding:20px;box-shadow:0 1px 3px rgba(0,0,0,.05)}table{width:100%}th{background:#f8f9fa;padding:10px;font-size:11px}td{padding:10px;font-size:13px;border-bottom:1px solid #eee}@media(max-width:768px){.sidebar{width:55px}.sidebar .logo h5,.sidebar nav a span{display:none}.main{margin-left:55px}}</style></head>
<body><aside class='sidebar'><div class='logo'><i class='fas fa-building-columns'></i><h5>CRFTS</h5></div><nav>
<a href='/'><i class='fas fa-th-large'></i> <span>Dashboard</span></a>
<a href='/departments/'><i class='fas fa-building'></i> <span>Departments</span></a>
<a href='/employees/' class='active'><i class='fas fa-users'></i> <span>Employees</span></a>
<a href='/logout/'><i class='fas fa-sign-out-alt'></i> <span>Logout</span></a></nav></aside>
<main class='main'><h4 class='mb-3'><i class='fas fa-users text-primary me-2'></i>Employees</h4>
<a href='/employees/add/' class='btn btn-primary mb-3'><i class='fas fa-plus me-1'></i>Add Employee</a>
<form class='mb-3'><input name='q' value='{{ q }}' class='form-control' placeholder='Search by payroll number or name...' style='max-width:350px'></form>
<div class='card'><table><thead><tr><th>Payroll #</th><th>Name</th><th>Designation</th><th>Department</th><th>Email</th></tr></thead><tbody>
{% for e in employees %}<tr><td><strong>{{ e.payroll }}</strong></td><td>{{ e.name }}</td><td>{{ e.designation|default:'--' }}</td><td>{{ e.department.name }}</td><td>{{ e.email }}</td></tr>
{% empty %}<tr><td colspan='5' class='text-center py-3'>No employees found</td></tr>{% endfor %}</tbody></table></div></main></body></html>
