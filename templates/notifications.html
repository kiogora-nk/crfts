<!DOCTYPE html><html lang='en'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Notifications - CRFTS</title>
<link href='https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css' rel='stylesheet'>
<link href='https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css' rel='stylesheet'>
<style>:root{--primary:#1a237e;--sidebar:240px}*{margin:0;padding:0}body{font-family:'Segoe UI',Arial,sans-serif;background:#f0f2f5;display:flex}.sidebar{width:var(--sidebar);background:linear-gradient(180deg,#0d1b4a,#1a237e,#283593);color:#fff;position:fixed;left:0;top:0;bottom:0}.sidebar .logo{padding:20px;text-align:center}.sidebar .logo i{font-size:40px}.sidebar nav a{display:flex;align-items:center;color:rgba(255,255,255,.75);padding:11px 25px;text-decoration:none;font-size:13px}.sidebar nav a:hover{color:#fff;background:rgba(255,255,255,.1)}.sidebar nav a i{width:22px}.main{margin-left:var(--sidebar);flex:1;padding:25px}.card{background:#fff;border-radius:10px;padding:20px;box-shadow:0 1px 3px rgba(0,0,0,.05)}.notif-item{padding:15px;border-bottom:1px solid #eee;display:flex;justify-content:space-between;align-items:center}.notif-item.unread{background:#f0f4ff;border-left:3px solid var(--primary)}.notif-item:hover{background:#f8f9fa}@media(max-width:768px){.sidebar{width:55px}.sidebar .logo h5,.sidebar nav a span{display:none}.main{margin-left:55px}}</style></head>
<body><aside class='sidebar'><div class='logo'><img src='/static/images/logo.png' alt='County Logo' style='width:60px;height:60px;border-radius:50%;margin-bottom:8px;background:white;padding:5px' onerror="this.style.display='none'"><h5>CRFTS</h5></div><nav>
<a href='/'><i class='fas fa-th-large'></i> <span>Dashboard</span></a>
<a href='/notifications/' class='active'><i class='fas fa-bell'></i> <span>Notifications</span></a>
<a href='/logout/'><i class='fas fa-sign-out-alt'></i> <span>Logout</span></a></nav></aside>
<main class='main'><h4 class='mb-4'><i class='fas fa-bell text-primary me-2'></i>Notifications</h4>
<div class='card'>
{% for n in notifications %}<div class='notif-item {% if not n.is_read %}unread{% endif %}'>
<div><strong>{{ n.notification_type }}</strong><br><small>{{ n.message }}</small><br><small class='text-muted'>{{ n.created_at|timesince }} ago</small></div>
<div>{% if not n.is_read %}<a href='/notifications/{{ n.id }}/read/' class='btn btn-sm btn-outline-primary'>Mark Read</a>{% else %}<span class='badge bg-success'>Read</span>{% endif %}</div></div>
{% empty %}<p class='text-center py-4 text-muted'><i class='fas fa-bell-slash fa-2x mb-2'></i><br>No notifications</p>{% endfor %}</div></main></body></html>
