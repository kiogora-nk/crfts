<!DOCTYPE html><html lang='en'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Register File - CRFTS</title>
<link href='https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css' rel='stylesheet'>
<link href='https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css' rel='stylesheet'>
<style>:root{--primary:#1a237e;--sidebar:240px}*{margin:0;padding:0}body{font-family:'Segoe UI',Arial,sans-serif;background:#f0f2f5;display:flex}.sidebar{width:var(--sidebar);background:linear-gradient(180deg,#0d1b4a,#1a237e,#283593);color:#fff;position:fixed;left:0;top:0;bottom:0}.sidebar .logo{padding:20px;text-align:center;border-bottom:1px solid rgba(255,255,255,.1)}.sidebar .logo i{font-size:40px;display:block}.sidebar .logo h5{font-size:14px;margin:5px 0 0}.sidebar nav a{display:flex;align-items:center;color:rgba(255,255,255,.75);padding:11px 25px;text-decoration:none;font-size:13px}.sidebar nav a:hover{color:#fff;background:rgba(255,255,255,.1)}.sidebar nav a i{width:22px}.main{margin-left:var(--sidebar);flex:1;padding:25px}.card{background:#fff;border-radius:10px;padding:25px;box-shadow:0 1px 3px rgba(0,0,0,.05);max-width:700px}.form-label{font-weight:600;font-size:13px;margin-bottom:3px;display:block}.form-control,.form-select{padding:10px;border:2px solid #ddd;border-radius:8px;width:100%;margin-bottom:15px}.form-control:focus,.form-select:focus{border-color:var(--primary);box-shadow:none}.required:after{content:' *';color:red}.upload-area{border:2px dashed #ccc;border-radius:10px;padding:30px;text-align:center;cursor:pointer;margin-bottom:15px;transition:.2s}.upload-area:hover{border-color:var(--primary);background:#f8f9ff}.upload-area i{font-size:40px;color:#999;margin-bottom:10px;display:block}@media(max-width:768px){.sidebar{width:55px}.sidebar .logo h5,.sidebar nav a span{display:none}.main{margin-left:55px}}</style></head>
<body><aside class='sidebar'><div class='logo'><i class='fas fa-building-columns'></i><h5>CRFTS</h5></div><nav>
<a href='/'><i class='fas fa-th-large'></i> <span>Dashboard</span></a>
<a href='/files/'><i class='fas fa-folder'></i> <span>Files</span></a>
<a href='/register/' class='active'><i class='fas fa-plus-circle'></i> <span>Register</span></a>
<a href='/transfers/'><i class='fas fa-exchange-alt'></i> <span>Transfers</span></a>
<a href='/notifications/'><i class='fas fa-bell'></i> <span>Notifications</span></a>
<a href='/logout/'><i class='fas fa-sign-out-alt'></i> <span>Logout</span></a></nav></aside>
<main class='main'><h4 class='mb-4'><i class='fas fa-plus-circle text-primary me-2'></i>Register New File</h4>
<div class='card'><form method='POST' enctype='multipart/form-data'>{% csrf_token %}
<label class='form-label required'>Subject</label><input name='subject' class='form-control' placeholder='Enter file subject' required>
<label class='form-label'>Description</label><textarea name='description' class='form-control' rows='3' placeholder='Enter description'></textarea>
<div class='row'><div class='col-md-6'><label class='form-label required'>Department</label><select name='dept' class='form-select' required><option value=''>Select Department</option>{% for d in departments %}<option value='{{ d.id }}'>{{ d.name }} ({{ d.code }})</option>{% endfor %}</select></div>
<div class='col-md-6'><label class='form-label'>Category</label><select name='category' class='form-select'><option value=''>Select Category</option>{% for c in categories %}<option value='{{ c.id }}'>{{ c.name }}</option>{% endfor %}</select></div></div>
<label class='form-label'>Priority</label><select name='priority' class='form-select'><option value='MEDIUM'>Medium</option><option value='LOW'>Low</option><option value='HIGH'>High</option><option value='URGENT'>Urgent</option></select>
<label class='form-label'>Upload Document (Optional)</label>
<div class='upload-area' onclick="document.getElementById('fileInput').click()"><i class='fas fa-cloud-upload-alt'></i><strong>Click to upload</strong> or drag and drop<br><small class='text-muted'>PDF, DOCX, XLSX, JPG, PNG (Max 25MB)</small></div>
<input type='file' name='document' id='fileInput' style='display:none' accept='.pdf,.docx,.xlsx,.jpg,.jpeg,.png' onchange="document.getElementById('fileName').textContent=this.files[0]?this.files[0].name:'No file selected'">
<p id='fileName' class='text-muted small'>No file selected</p>
<div class='alert alert-info'><i class='fas fa-info-circle me-1'></i>File number auto-generates: <strong>CGM-DEPT-YYYY-XXXXXX</strong></div>
<button type='submit' class='btn btn-primary btn-lg'><i class='fas fa-save me-1'></i>Register File</button>
<a href='/' class='btn btn-secondary btn-lg ms-2'>Cancel</a></form></div></main></body></html>
