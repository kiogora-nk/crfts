<!DOCTYPE html><html lang='en'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Return File - CRFTS</title>
<link href='https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css' rel='stylesheet'>
<link href='https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css' rel='stylesheet'>
<style>:root{--p:#1a237e;--s:240px}*{margin:0;padding:0}body{font-family:'Segoe UI',Arial;background:#f0f2f5;display:flex}.sidebar{width:var(--s);background:linear-gradient(180deg,#0d1b4a,#1a237e,#283593);color:#fff;position:fixed;left:0;top:0;bottom:0}.sidebar .logo{padding:20px;text-align:center}.sidebar .logo i{font-size:40px}.main{margin-left:var(--s);flex:1;padding:25px}.card{background:#fff;border-radius:10px;padding:25px;box-shadow:0 1px 3px rgba(0,0,0,.05);max-width:600px;margin:0 auto}.form-label{font-weight:600;font-size:13px;display:block;margin-bottom:5px;margin-top:15px}.form-control{padding:10px;width:100%;border:2px solid #ddd;border-radius:8px}@media(max-width:768px){.sidebar{width:55px}.sidebar .logo h5,.sidebar nav a span{display:none}.main{margin-left:55px}}</style></head>
<body><aside class='sidebar'><div class='logo'><i class='fas fa-building-columns'></i><h5>CRFTS</h5></div></aside>
<main class='main'><div class='card'><h4><i class='fas fa-undo text-warning me-2'></i>Return File</h4>
<p><strong>{{ file.file_number }}</strong> - {{ file.subject }}</p>
<p class='text-muted'>Held for: {{ file.days_held }} days | Expected return: {{ file.expected_return_date|date:'Y-m-d'|default:'Not set' }}</p>
<form method='POST'>{% csrf_token %}
<label class='form-label'><i class='fas fa-file-alt me-1'></i> Final Report *</label>
<textarea name='report' class='form-control' rows='5' placeholder='Write your final report before returning this file...' required></textarea>
<button type='submit' class='btn btn-warning btn-lg mt-3 w-100'><i class='fas fa-undo me-1'></i>Return File with Report</button></form>
<a href='/file/{{ file.id }}/' class='btn btn-secondary w-100 mt-2'>Cancel</a></div></main></body></html>
