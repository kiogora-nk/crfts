<!DOCTYPE html><html lang='en'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Upload - MERU</title>
<link href='https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css' rel='stylesheet'>
<link href='https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css' rel='stylesheet'>
<style>:root{--primary:#1a237e;--sidebar:240px}*{margin:0;padding:0}body{font-family:'Segoe UI',Arial,sans-serif;background:#f0f2f5;display:flex}.sidebar{width:var(--sidebar);background:linear-gradient(180deg,#0d1b4a,#1a237e,#283593);color:#fff;position:fixed;left:0;top:0;bottom:0}.sidebar .logo{padding:20px;text-align:center}.sidebar .logo i{font-size:40px}.sidebar nav a{display:flex;align-items:center;color:rgba(255,255,255,.75);padding:11px 25px;text-decoration:none;font-size:13px}.sidebar nav a i{width:22px}.main{margin-left:var(--sidebar);flex:1;padding:25px}.card{background:#fff;border-radius:10px;padding:25px;box-shadow:0 1px 3px rgba(0,0,0,.05);max-width:600px;margin:0 auto}@media(max-width:768px){.sidebar{width:55px}.sidebar .logo h5,.sidebar nav a span{display:none}.main{margin-left:55px}}</style></head>
<body><aside class='sidebar'><div class='logo'><img src='/static/images/logo.png' alt='County Logo' style='width:60px;height:60px;border-radius:50%;margin-bottom:8px;background:white;padding:5px' onerror="this.style.display='none'"><h5>MERU</h5></div><nav>
<a href='/'><i class='fas fa-th-large'></i> <span>Dashboard</span></a>
<a href='/files/'><i class='fas fa-folder'></i> <span>Files</span></a></nav></aside>
<main class='main'><h4 class='mb-4'><i class='fas fa-upload text-primary me-2'></i>Upload Document</h4>
<div class='card'><p><strong>File:</strong> {{ file.file_number }} - {{ file.subject }}</p>
<form method='POST' enctype='multipart/form-data'>{% csrf_token %}
<div class='mb-3'><label class='form-label fw-bold'>Select Document</label><input type='file' name='doc' class='form-control' required accept='.pdf,.docx,.xlsx,.jpg,.jpeg,.png'><small class='text-muted'>PDF, DOCX, XLSX, JPG, PNG (Max 25MB)</small></div>
<button type='submit' class='btn btn-primary btn-lg'><i class='fas fa-upload me-1'></i>Upload</button>
<a href='/file/{{ file.id }}/' class='btn btn-secondary btn-lg ms-2'>Cancel</a></form></div></main></body></html>
