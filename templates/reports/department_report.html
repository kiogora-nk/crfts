<!DOCTYPE html><html lang='en'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Department Report - CRFTS</title>
<link href='https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css' rel='stylesheet'>
<style>:root{--primary:#1a237e;--sidebar:240px}*{margin:0;padding:0}body{font-family:'Segoe UI',Arial,sans-serif;background:#f0f2f5;display:flex}.sidebar{width:var(--sidebar);background:linear-gradient(180deg,#0d1b4a,#1a237e,#283593);color:#fff;position:fixed;left:0;top:0;bottom:0}.sidebar .logo{padding:20px;text-align:center}.sidebar .logo i{font-size:40px}.main{margin-left:var(--sidebar);flex:1;padding:25px}.card{background:#fff;border-radius:10px;padding:20px;box-shadow:0 1px 3px rgba(0,0,0,.05)}table{width:100%}th{background:#f8f9fa;padding:10px}td{padding:10px}</style></head>
<body><aside class='sidebar'><div class='logo'><i class='fas fa-building-columns'></i><h5>CRFTS</h5></div></aside>
<main class='main'><h4 class='mb-3'><i class='fas fa-building text-primary me-2'></i>Department Report</h4>
<div class='card'><table><thead><tr><th>Department</th><th>Total Files</th><th>Completed</th><th>Pending</th></tr></thead><tbody>
{% for d in data %}<tr><td><strong>{{ d.name }}</strong></td><td>{{ d.total }}</td><td>{{ d.completed }}</td><td>{{ d.pending }}</td></tr>{% endfor %}</tbody></table></div></main></body></html>
