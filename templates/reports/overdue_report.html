<!DOCTYPE html><html lang='en'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Overdue Files - CRFTS</title>
<link href='https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css' rel='stylesheet'>
<style>:root{--primary:#1a237e;--sidebar:240px}*{margin:0;padding:0}body{font-family:'Segoe UI',Arial,sans-serif;background:#f0f2f5;display:flex}.sidebar{width:var(--sidebar);background:linear-gradient(180deg,#0d1b4a,#1a237e,#283593);color:#fff;position:fixed;left:0;top:0;bottom:0}.sidebar .logo{padding:20px;text-align:center}.sidebar .logo i{font-size:40px}.main{margin-left:var(--sidebar);flex:1;padding:25px}.card{background:#fff;border-radius:10px;padding:20px;box-shadow:0 1px 3px rgba(0,0,0,.05)}table{width:100%}th{background:#fff3cd;padding:10px}td{padding:10px}</style></head>
<body><aside class='sidebar'><div class='logo'><img src='/static/images/logo.png' alt='County Logo' style='width:60px;height:60px;border-radius:50%;margin-bottom:8px;background:white;padding:5px' onerror="this.style.display='none'"><h5>CRFTS</h5></div></aside>
<main class='main'><h4 class='mb-3'><i class='fas fa-exclamation-triangle text-danger me-2'></i>Overdue Files</h4>
<div class='alert alert-danger'><strong>{{ count }}</strong> files are overdue (more than 7 days)</div>
<div class='card'><table><thead><tr><th>File Number</th><th>Subject</th><th>Department</th><th>Days Held</th></tr></thead><tbody>
{% for f in files %}<tr><td><a href='/file/{{ f.id }}/'>{{ f.file_number }}</a></td><td>{{ f.subject }}</td><td>{{ f.current_department.name }}</td><td class='text-danger fw-bold'>{{ f.days_held }} days</td></tr>
{% empty %}<tr><td colspan='4' class='text-center text-success'>No overdue files!</td></tr>{% endfor %}</tbody></table></div></main></body></html>
