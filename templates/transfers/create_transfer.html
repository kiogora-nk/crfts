<!DOCTYPE html><html lang='en'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Create Transfer - CRFTS</title>
<link href='https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css' rel='stylesheet'>
<link href='https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css' rel='stylesheet'>
<style>:root{--p:#1a237e;--s:240px}*{margin:0;padding:0}body{font-family:'Segoe UI',Arial;background:#f0f2f5;display:flex}.sidebar{width:var(--s);background:linear-gradient(180deg,#0d1b4a,#1a237e,#283593);color:#fff;padding:20px;position:fixed;height:100vh}.sidebar .logo{text-align:center;margin-bottom:20px}.sidebar .logo i{font-size:35px}.sidebar h5{font-size:13px}.sidebar nav a{display:flex;align-items:center;color:rgba(255,255,255,.75);padding:10px;text-decoration:none;font-size:13px}.sidebar nav a:hover{color:#fff;background:rgba(255,255,255,.1)}.sidebar nav a i{width:22px}.main{margin-left:var(--s);flex:1;padding:20px}.card{background:#fff;padding:20px;border-radius:10px;box-shadow:0 1px 3px rgba(0,0,0,.05);max-width:650px}.form-label{font-weight:600;font-size:13px;display:block;margin-bottom:3px;margin-top:12px}.form-control,.form-select{padding:10px;width:100%;border:2px solid #ddd;border-radius:8px}.btn-primary{background:var(--p);color:#fff;padding:12px 30px;border:none;border-radius:8px;cursor:pointer;font-size:15px;font-weight:600}@media(max-width:768px){.sidebar{width:55px}.sidebar .logo h5,.sidebar nav a span{display:none}.main{margin-left:55px}}</style></head>
<body><aside class='sidebar'><div class='logo'><i class='fas fa-building-columns'></i><h5>CRFTS</h5></div><nav>
<a href='/my-dashboard/'><i class='fas fa-th-large'></i> <span>Dashboard</span></a>
<a href='/transfers/'><i class='fas fa-exchange-alt'></i> <span>Transfers</span></a>
<a href='/transfers/create/' style='color:#fff'><i class='fas fa-plus'></i> <span>New Transfer</span></a>
<a href='/logout/'><i class='fas fa-sign-out-alt'></i> <span>Logout</span></a></nav></aside>
<main class='main'><h4 class='mb-3'><i class='fas fa-paper-plane text-primary me-2'></i>Create Transfer</h4>
<div class='card'><form method='POST'>{% csrf_token %}
<label class='form-label'>Select File *</label><select name='file_id' class='form-select' required><option value=''>Choose file...</option>{% for f in files %}<option value='{{ f.id }}'>{{ f.file_number }} - {{ f.subject|truncatechars:60 }}</option>{% endfor %}</select>
<label class='form-label'>To Department *</label><select name='to_dept' id='toDept' class='form-select' required onchange='loadEmployees()'><option value=''>Select department...</option>{% for d in departments %}<option value='{{ d.id }}'>{{ d.name }} ({{ d.code }})</option>{% endfor %}</select>
<label class='form-label'>To Employee <small class='text-muted'>(Leave empty = entire department gets notified)</small></label><select name='to_emp' id='toEmp' class='form-select'><option value=''>All Department Members</option></select>
<label class='form-label'>Transfer Type</label><select name='type' class='form-select'><option value='TRANSFER'>Transfer</option><option value='FORWARD'>Forward</option><option value='RETURN'>Return</option></select>
<label class='form-label'>Remarks</label><textarea name='remarks' class='form-control' rows='2' placeholder='Optional notes...'></textarea>
<button type='submit' class='btn-primary mt-3'><i class='fas fa-paper-plane me-1'></i>Initiate Transfer</button>
<a href='/transfers/' class='btn btn-secondary ms-2 mt-3' style='padding:12px 30px'>Cancel</a></form></div></main>
<script>
function loadEmployees(){
    var deptId = document.getElementById('toDept').value;
    var sel = document.getElementById('toEmp');
    sel.innerHTML = '<option value="">All Department Members</option>';
    if(deptId){
        fetch('/api/dept-employees/'+deptId)
        .then(function(r){return r.json()})
        .then(function(data){
            data.forEach(function(e){
                sel.innerHTML += '<option value="'+e.id+'">'+e.name+' ('+e.payroll+')</option>';
            });
        });
    }
}
</script></body></html>
