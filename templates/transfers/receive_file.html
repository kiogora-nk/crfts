<!DOCTYPE html><html lang='en'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Receive File - CRFTS</title>
<link href='https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css' rel='stylesheet'>
<link href='https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css' rel='stylesheet'>
<style>:root{--p:#1a237e;--s:240px}*{margin:0;padding:0}body{font-family:'Segoe UI',Arial;background:#f0f2f5;display:flex}.sidebar{width:var(--s);background:linear-gradient(180deg,#0d1b4a,#1a237e,#283593);color:#fff;position:fixed;left:0;top:0;bottom:0}.sidebar .logo{padding:20px;text-align:center}.sidebar .logo i{font-size:40px}.main{margin-left:var(--s);flex:1;padding:25px}.card{background:#fff;border-radius:10px;padding:25px;box-shadow:0 1px 3px rgba(0,0,0,.05);max-width:600px;margin:0 auto}.form-label{font-weight:600;font-size:13px;display:block;margin-bottom:5px;margin-top:15px}.form-control,.form-select{padding:10px;width:100%;border:2px solid #ddd;border-radius:8px}@media(max-width:768px){.sidebar{width:55px}.sidebar .logo h5,.sidebar nav a span{display:none}.main{margin-left:55px}}</style></head>
<body><aside class='sidebar'><div class='logo'><img src='/static/images/logo.png' alt='County Logo' style='width:60px;height:60px;border-radius:50%;margin-bottom:8px;background:white;padding:5px' onerror="this.style.display='none'"><h5>CRFTS</h5></div></aside>
<main class='main'><div class='card'><h4><i class='fas fa-inbox text-primary me-2'></i>Receive File</h4>
<table class='table table-bordered mt-3'><tr><th>Transfer #</th><td>{{ transfer.transfer_number }}</td></tr><tr><th>File</th><td>{{ transfer.file.file_number }} - {{ transfer.file.subject }}</td></tr><tr><th>From</th><td>{{ transfer.from_dept.name }}</td></tr><tr><th>To</th><td>{{ transfer.to_dept.name }}</td></tr></table>
<form method='POST'>{% csrf_token %}
<label class='form-label'><i class='fas fa-clock me-1'></i> How many days will you hold this file?</label>
<select name='hold_days' class='form-select' required>
    <option value='1'>1 Day</option><option value='3'>3 Days</option><option value='5'>5 Days</option><option value='7' selected>7 Days</option><option value='14'>14 Days</option><option value='30'>30 Days</option>
</select>
<label class='form-label'><i class='fas fa-file-alt me-1'></i> Write Report / Remarks *</label>
<textarea name='report' class='form-control' rows='4' placeholder='Write your report or comments about this file...' required></textarea>
<button type='submit' class='btn btn-success btn-lg mt-3 w-100'><i class='fas fa-check-circle me-1'></i>Confirm Receipt & Submit Report</button></form>
<a href='/transfers/' class='btn btn-secondary w-100 mt-2'>Cancel</a></div></main></body></html>
